[project]
name = "ai-vmp"
version = "0.1.0"
description = "AI vendor management platform"
readme = "README.md"
authors = [
    { name = "Ashim Sharma", email = "ashimsharma50@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2.9",
]

[project.scripts]
ai-vmp = "ai_vmp:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"
